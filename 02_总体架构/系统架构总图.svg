<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="1000" height="760" fill="#f8fafc"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a" font-family="sans-serif">Jarvis 系统架构总图（第一阶段，2026-11-19）</text>
<text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">实线框 = 已实现（P0–P5）  虚线框 = 架构位置已留，尚未实现  外部供应商 = 第二阶段接入，P0–P5 全部用 Stub</text>
<rect x="380" y="65" width="240" height="55" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/><text x="500.0" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">用户 / 事件</text><text x="500.0" y="109" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">聊天 · 定时 · 文件变化</text>
<line x1="500" y1="120" x2="500" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="280" y="140" width="440" height="90" rx="10" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/><text x="500.0" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Agent Core（确定性编排器）</text><text x="500.0" y="184" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">core.py：启动顺序 config→database→policy→audit→scheduler</text><text x="500.0" y="201" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">事件日志是唯一事实源；不 import 任何模型 SDK</text>
<line x1="195" y1="230" x2="195" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="385" y1="230" x2="385" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="575" y1="230" x2="575" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="765" y1="230" x2="765" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="250" width="230" height="130" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="195.0" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Planner</text><text x="195.0" y="294" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">planner.py（P4）</text><text x="195.0" y="311" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">任务分解为有序步骤</text><text x="195.0" y="328" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">经网关执行，失败即停</text><text x="195.0" y="345" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">状态追踪，可重跑</text>
<rect x="270" y="250" width="230" height="130" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Model Router</text><text x="385.0" y="294" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">router.py（P2）</text><text x="385.0" y="311" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">逻辑模型名映射</text><text x="385.0" y="328" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">切换链 · 降级 · 审计</text><text x="385.0" y="345" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">现为 Stub，未接真实 API</text>
<rect x="460" y="250" width="230" height="130" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="575.0" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Tool Gateway</text><text x="575.0" y="294" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">gateway.py（P3）</text><text x="575.0" y="311" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">唯一工具入口</text><text x="575.0" y="328" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">权限检查在执行前</text><text x="575.0" y="345" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">拒绝只记审计</text>
<rect x="650" y="250" width="230" height="130" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="765.0" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Memory</text><text x="765.0" y="294" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">memory.py（P1–P2）</text><text x="765.0" y="311" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">写时 gate · 隔离区</text><text x="765.0" y="328" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">修正留历史 · 过期标记</text><text x="765.0" y="345" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">JSONL 导出 / 导入</text>
<line x1="385" y1="380" x2="385" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="230" y="400" width="340" height="85" rx="10" fill="#e0e7ff" stroke="#334155" stroke-width="1.5"/><text x="400.0" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">外部模型供应商（可替换）</text><text x="400.0" y="444" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">LiteLLM Proxy 占位（未启用）</text><text x="400.0" y="461" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">Gemini 免费层 / Groq / OpenRouter :free / Ollama 本地</text>
<line x1="575" y1="380" x2="575" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="460" y="400" width="230" height="85" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="575.0" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">本地工具</text><text x="575.0" y="444" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">list_tasks · read_task</text><text x="575.0" y="461" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">memory-* · router-call</text>
<line x1="765" y1="380" x2="765" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="650" y="400" width="230" height="85" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="765.0" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">SQLite（本地）</text><text x="765.0" y="444" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">jarvis.db：记忆 / 任务 / 计划</text><text x="765.0" y="461" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">improvements.db：提案 / 评价 / 部署</text>
<rect x="80" y="505" width="440" height="75" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Permission / Policy（横切）</text><text x="300.0" y="549" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">config.yaml policy 节；destructive 一律拒绝</text><text x="300.0" y="566" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">external 需开网络（现为 false）</text>
<rect x="540" y="505" width="440" height="75" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/><text x="760.0" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">Audit（横切）</text><text x="760.0" y="549" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">data/events.jsonl，追加写，不可改</text><text x="760.0" y="566" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">参数只记 hash 与键名摘要</text>
<rect x="80" y="600" width="900" height="75" rx="10" fill="#ede9fe" stroke="#334155" stroke-width="1.5"/><text x="530.0" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="sans-serif">自我改进 Improvement（P5）</text><text x="530.0" y="644" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">提案 → 测试（临时复制目录）→ 评价 → 批准（用户显式动作）→ 部署（先备份）→ 监控（无副作用探针）→ 可回滚</text><text x="530.0" y="661" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">不可变规则：policy / destructive 拒绝逻辑 / 启动顺序 / 批准检查本身</text>
<rect x="80" y="695" width="900" height="45" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500" y="723" text-anchor="middle" font-size="13" fill="#64748b" font-family="sans-serif">尚未实现（架构位置已留）：Knowledge · User Model · Proactive Engine · Evaluation（独立模块）</text>
</svg>