name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  p5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.1
      - name: Run P0-P5 cumulative tests (38)
        working-directory: 04_源代码/jarvis-p5
        run: python3 -m unittest discover -s tests -v
